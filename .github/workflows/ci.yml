name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # A runner's own Python can lack SQLite extension loading, which
      # sqlite-vec needs; uv's builds have it.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # uv sync provisions the Python named in .python-version, so no
      # separate setup-python step is needed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Locate tree-sitter parsers
        id: parsers
        shell: bash
        run: echo "dir=$(uv run python -c 'import tree_sitter_language_pack as t; print(t.cache_dir())')" >> "$GITHUB_OUTPUT"

      - name: Cache tree-sitter parsers
        id: parser-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.parsers.outputs.dir }}
          key: tree-sitter-parsers-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # The language pack downloads its parsers on first use, so a failed
      # download would surface as a test failure; fetch them here, with retries.
      - name: Download tree-sitter parsers
        if: steps.parser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            uv run python -c 'import tree_sitter_language_pack as t; t.download_all()' && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      - name: Install Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Run checks
        if: runner.os == 'Linux'
        run: scripts/check.sh

      - name: Run tests
        if: runner.os != 'Linux'
        run: uv run pytest -q
